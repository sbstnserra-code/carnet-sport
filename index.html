<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet Sport</title>
<meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#ECEEEA; --surface:#FFFFFF; --surface-2:#F3F4F1; --ink:#14171A; --ink-2:#4F555A; --muted:#7D8387;
  --line:#DCDFD8; --line-2:#C5C9C1; --accent:#F2B705; --accent-soft:#FCEFC2; --on-accent:#14171A;
  --btn:#14171A; --on-btn:#F3F4F1; --s1:#2a78d6; --s2:#eb6834; --s1-soft:rgba(42,120,214,.30);
  --good:#0ca30c; --good-text:#0B6B14; --warn:#fab219; --crit:#d03b3b; --crit-text:#B42F2F;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 8px 24px rgba(20,23,26,.06);
  --r:14px; --nav-h:62px; --mp:#2f7fe0; --mc:#ef8a24; --mf:#a259d9; --m1:#86b6ef; --m2:#3987e5; --m3:#1c5cab; --m4:#0d366b;
  --f-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1012; --surface:#171A1D; --surface-2:#1F2327; --ink:#EDEFEB; --ink-2:#B3B8B9; --muted:#80868A;
    --line:#2A2F33; --line-2:#3A4045; --accent:#F2B705; --accent-soft:#3A3114; --on-accent:#14171A;
    --btn:#EDEFEB; --on-btn:#14171A; --s1:#3987e5; --s2:#d95926; --s1-soft:rgba(57,135,229,.32);
    --good-text:#3CC23C; --crit-text:#E66767; --shadow:none; color-scheme:dark; --mp:#5aa0f0; --mc:#f5a04a; --mf:#b884e6; --m1:#184f95; --m2:#2a78d6; --m3:#6da7ec; --m4:#b7d3f6;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1012; --surface:#171A1D; --surface-2:#1F2327; --ink:#EDEFEB; --ink-2:#B3B8B9; --muted:#80868A;
  --line:#2A2F33; --line-2:#3A4045; --accent:#F2B705; --accent-soft:#3A3114; --on-accent:#14171A;
  --btn:#EDEFEB; --on-btn:#14171A; --s1:#3987e5; --s2:#d95926; --s1-soft:rgba(57,135,229,.32);
  --good-text:#3CC23C; --crit-text:#E66767; --shadow:none; color-scheme:dark; --mp:#5aa0f0; --mc:#f5a04a; --mf:#b884e6; --m1:#184f95; --m2:#2a78d6; --m3:#6da7ec; --m4:#b7d3f6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.inp[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.45 var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 72px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-inline:-16px;padding:10px 16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark{font:700 24px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase}
.mark i{font-style:normal;color:var(--accent);-webkit-text-stroke:.5px var(--on-accent)}
@media (max-width:440px){.brand .sub{display:none}}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--crit)}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg,.tabs svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:700 30px/1.05 var(--f-d);letter-spacing:.01em}
.eyebrow{font:600 12px/1.2 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-t{font:600 15px/1.2 var(--f-d);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card>.sec-t{margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap} .row.end{justify-content:flex-end} .row.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num-t{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:11px;background:var(--btn);color:var(--on-btn);font-weight:600;white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--crit);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.lnk{color:var(--ink);font-weight:600;font-size:14px;padding:8px 4px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pg-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:4px;border-bottom:1px solid var(--line)}.pg-tabs .chip{flex:none;min-height:32px;font-size:13.5px}
.chip small{color:inherit;opacity:.7;font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{min-height:32px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:16px}
textarea.inp{min-height:80px;resize:vertical;line-height:1.4}
.inp::placeholder{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.daybar .d{font:700 23px/1.05 var(--f-d);text-align:center;flex:1;min-width:0}
.daybar .d small{display:block;font:500 12px/1.3 var(--f-b);color:var(--muted);letter-spacing:.02em}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font:700 28px/1 var(--f-d);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.sm{font-size:19px;white-space:normal;line-height:1.15;overflow:visible}
.tile .v small{font:600 14px var(--f-d);color:var(--ink-2);margin-left:2px}
.tile .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.delta{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.delta.up{color:var(--good-text)} .delta.down{color:var(--crit-text)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:2px}
.goal .gl{font-weight:600}
.goal .gv{font:700 18px/1 var(--f-d);text-align:right;font-variant-numeric:tabular-nums}
.goal .gv small{font:500 13px var(--f-b);color:var(--muted)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar>span{display:block;height:100%;background:var(--ink)}
.bar>span.good{background:var(--good)}
.bar>span.est{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.8}
.goal .gs{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.li .r{font:700 18px/1 var(--f-d);white-space:nowrap;text-align:right}
.li .r small{display:block;font:500 12px var(--f-b);color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:6px;vertical-align:middle}
.badge-pr{display:inline-flex;align-items:center;gap:3px;font:700 12px/1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:4px 7px;border-radius:6px;vertical-align:middle}
/* Séance */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tpl b{font:700 18px/1.1 var(--f-d)}
.tpl span{font-size:12.5px;color:var(--muted)}
.tpl.sug{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tpl.sug span::before{content:"Prévu aujourd'hui · ";color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.ex.todo{border-style:dashed;box-shadow:none}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-h h3{font:700 21px/1.1 var(--f-d);letter-spacing:.01em;margin-right:6px;display:inline}
.ex-h .tags{display:inline-flex;gap:6px;vertical-align:2px;flex-wrap:wrap}
.ex .last{margin:0;font-size:13px;color:var(--muted)}
.ex .last b{color:var(--ink-2);font-weight:600}
.ex .exnote{margin:0;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 9px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 12px minmax(0,1fr) 44px 26px;align-items:center;gap:5px;border-radius:10px;padding:3px 0}
.set.cardio{grid-template-columns:22px repeat(3,minmax(0,1fr)) 44px 26px}
.set .n{font:700 17px/1 var(--f-d);color:var(--muted);text-align:center}
.set.drop .n{color:var(--ink-2)}
.set .x{text-align:center;color:var(--muted);font-weight:600}
.f{position:relative;display:block}
.f small{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.num{width:100%;height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);color:var(--ink);text-align:left;padding:0 28px 0 9px;font:600 20px/1 var(--f-d);font-variant-numeric:tabular-nums}
.num::placeholder{color:var(--muted);opacity:.75;font-weight:500}
.set.ok .num{background:var(--accent-soft);border-color:transparent}
.ok-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--muted)}
.ok-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.ok .ok-btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.del{width:26px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.ex-actions{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.quick{display:flex;gap:6px;flex:1;min-width:210px}
.quick input{flex:1;min-width:0;height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);padding:0 10px;font-size:15px;color:var(--ink)}
.props{display:flex;flex-direction:column;gap:14px}
.prop-g h4{margin:0 0 4px;font:600 13px/1.2 var(--f-b);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prop{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.prop:first-of-type{border-top:0}
.prop .main{flex:1;min-width:0}
.prop .t{font-weight:600}
.prop .s{font-size:12.5px;color:var(--muted)}
.plus{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.plus svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
/* Nutrition */
.meal{display:flex;flex-direction:column;gap:6px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-h b{font:700 19px/1.1 var(--f-d)}
.meal-h .k{font:600 16px var(--f-d);color:var(--ink-2)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .s{font-size:12px;color:var(--muted)}
.item .k{font:700 17px var(--f-d);white-space:nowrap}
.imputed{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px dashed var(--line-2)}
.macro{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.macro .bar{grid-column:auto}
.macro b{font:700 16px var(--f-d);white-space:nowrap}
/* v6.5 : macros par couleur */
.mk{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px;background:var(--muted);flex:none}
.mk.p{background:var(--mp)}.mk.c{background:var(--mc)}.mk.f{background:var(--mf)}
.bar>span.m-p{background:var(--mp)}.bar>span.m-c{background:var(--mc)}.bar>span.m-f{background:var(--mf)}
.macro>span:first-child{display:flex;align-items:center;gap:2px;white-space:nowrap}
.mchips{display:inline-flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);line-height:1.3}
.mchips>span{display:inline-flex;align-items:center;white-space:nowrap}
.mchips b{font:700 14.5px/1 var(--f-d);color:var(--ink);margin-right:2px}
.item .s .mchips{font-size:12px}.item .s .mchips b{font-size:13.5px}.item .s .mk{width:7px;height:7px;margin-right:3px}
.mstack{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:1px}
.mstack.lg{height:10px}
.mstack span{display:block;height:100%;min-width:0}
.mstack .p{background:var(--mp)}.mstack .c{background:var(--mc)}.mstack .f{background:var(--mf)}
.meal-sum{display:flex;flex-direction:column;gap:6px;padding:0 0 2px}
.msplit{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;color:var(--ink-2)}
.msplit>span{display:inline-flex;align-items:center;white-space:nowrap}
.msplit b{font:700 14px/1 var(--f-d);color:var(--ink);margin-left:3px}
.msplit-w{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);margin-top:2px;padding-top:10px}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.mlegend span{display:inline-flex;align-items:center}
.big{font:700 40px/1 var(--f-d);letter-spacing:.01em}
.big small{font:600 17px var(--f-d);color:var(--muted)}
.bd{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bd div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line-2);padding:3px 0}
/* Charts */
.chart{position:relative;height:220px;margin-top:6px}
.chart.sm{height:180px}
.chart-t{font-weight:600;font-size:14px}
.chart-s{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-inline:-2px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.w{white-space:normal}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{display:block;width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:#86b6ef;border-color:transparent} .heat i.l2{background:#3987e5;border-color:transparent}
.heat i.l3{background:#1c5cab;border-color:transparent} .heat i.l4{background:#0d366b;border-color:transparent}
.heat i.fut{opacity:.35}
.spark{width:84px;height:28px;flex:none}

function isCardioDay(d) { const es = cardioEntries(d); return es.some(e => !isWalkEx(e.ex)) || es.reduce((a, e) => a + sumMin(doneSets(e)), 0) >= WALK_MIN; }

  const it = { t: `${EXP[lvl].l} (saisie express)`, kcal: r(b.kcal), p: r(b.p), c: r(b.c), f: r(b.f), src: 'express', lvl };

async function bulkImport(data) {
  let n = 0; const list = [];
  for (const c of COLS) for (const [id, doc] of Object.entries(data[c] || {})) if (doc && typeof doc === 'object') list.push([c, id, doc]);
  toast(`Import de ${list.length} éléments…`);
  for (const [c, id, doc] of list) {
    S[c][id] = doc; VER++;
    if (Store.mode === 'cloud') { Store.inflight.add(c + '/' + id); try { await writeOnce(c, id); n++; } catch (e) { onWriteError(e, c, id); } finally { Store.inflight.delete(c + '/' + id); } await sleep(40); }
    else n++;
  }
  lsSave(); render(); toast(`${n} éléments restaurés.`);
}

const REST = { end: 0, dur: 90, t: null, hide: null, on: false };
function startRest(sec) {
  REST.end = Date.now() + sec * 1000; REST.dur = sec; REST.on = true;
  const el = $('#rest'); el.hidden = false; el.classList.remove('done'); $('#rest-label').textContent = 'Repos';
  clearInterval(REST.t); clearTimeout(REST.hide); tickRest(); REST.t = setInterval(tickRest, 250);
}
function tickRest() {
  const left = Math.max(0, Math.ceil((REST.end - Date.now()) / 1000)), txt = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $('#rest-time').textContent = txt;
  const fr = $('#fx-rest-time'); if (fr) { fr.textContent = txt; const ring = $('#fx-ring'); if (ring) ring.style.setProperty('--p', Math.max(0, Math.min(100, (REST.end - Date.now()) / (REST.dur * 1000) * 100))); }
  if (left <= 0) {
    clearInterval(REST.t); REST.on = false;
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch { }
    if (FOCUS.open && FOCUS.phase === 'rest') { $('#rest').hidden = true; fxGoNext(); return; }
    $('#rest').classList.add('done'); $('#rest-label').textContent = 'À toi';
    clearTimeout(REST.hide); REST.hide = setTimeout(stopRest, 6000);
  }
}
function stopRest() { clearInterval(REST.t); clearTimeout(REST.hide); REST.on = false; $('#rest').hidden = true; }

const mkDoc = r => ({ id: r.doc_id, data: () => r.data });
async function fetchCol(col) {
  const out = [];

const RT = {
  subs: {}, chan: null, last: null, polling: false,
  async listen(col, cb, errCb) {
    this.subs[col] = { cb, errCb };
    let rows;
    try { rows = await fetchCol(col); } catch (e) { errCb && errCb(sbErr(e)); return; }
    for (const r of rows) if (r.updated_at && (!this.last || r.updated_at > this.last)) this.last = r.updated_at;
    if (!this.last) this.last = new Date(Date.now() - 60000).toISOString();
    const docs = rows.map(mkDoc);
    cb({ docs, docChanges: () => docs.map(doc => ({ type: 'added', doc })) });
    this.ensureChannel();
    if (col === 'exercises' && !rows.length) seedCatalogue();
  },
  dispatch(row, type) {
    const s = this.subs[row.col]; if (row.updated_at && row.updated_at > this.last) this.last = row.updated_at;
    if (!s) return; const doc = mkDoc(row);
    s.cb({ docs: [], docChanges: () => [{ type, doc }] });
  },
  ensureChannel() {
    if (this.chan || !AUTH.user) return;
    this.chan = sb.channel('docs-' + AUTH.user.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'user_id=eq.' + AUTH.user.id }, p => {
        const row = p.eventType === 'DELETE' ? p.old : p.new; if (!row || !row.col) return;
        this.dispatch(row, p.eventType === 'DELETE' ? 'removed' : p.eventType === 'INSERT' ? 'added' : 'modified');
      })
      .subscribe(status => { if (status === 'SUBSCRIBED') this.poll(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.poll(); });
    window.addEventListener('online', () => this.poll());
    setInterval(() => { if (document.visibilityState === 'visible') this.poll(); }, 90000);
  },
  async poll() {
    if (!this.last || this.polling) return; this.polling = true;
    try {
      const { data, error } = await sb.from('docs').select('col,doc_id,data,updated_at').gt('updated_at', this.last).order('updated_at').limit(500);
      if (error) throw error;
      for (const r of data) this.dispatch(r, 'modified');
      if (Store.err === 'unavailable') { Store.err = null; syncUI(); }
    } catch (e) { } finally { this.polling = false; }
  }
};

/* Estimations IA via la fonction serveur « ai » (clé Anthropic côté serveur) */
function fileToB64(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', .85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(mkErr('images_unavailable', 'image illisible')); };
    img.src = url;
  });
}
const AI = {
  async limits() { return { images: SAMPLE_IMG }; },
  async json(prompt, opts = {}) {
    const body = { prompt, tier: opts.modelTier || 'quick', feature: opts.feature || 'ia_repas' };
    if (opts.images) body.image = await fileToB64(opts.images);
    let r;
    try { r = await fetch(SB_URL + '/functions/v1/ai', { method: 'POST', headers: fnHeaders(), body: JSON.stringify(body), signal: opts.signal }); }
    catch (e) { throw e && e.name === 'AbortError' ? mkErr('cancelled') : mkErr('unavailable'); }
    if (r.status === 503) throw mkErr('not_granted', 'clé IA absente');
    if (r.status === 429) throw mkErr('rate_limited');
    if (r.status === 403) { let j = null; try { j = await r.json(); } catch { } if (j && j.code === 'plan') { BRICK_DENY.add(j.feature || body.feature); throw mkErr('plan_locked', j.error); } throw mkErr('not_granted'); }
    if (r.status === 401) throw mkErr('not_granted');
    if (!r.ok) throw mkErr('error', 'HTTP ' + r.status);
    const j = await r.json(); return j.json;
  }
};
