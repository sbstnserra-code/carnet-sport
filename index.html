<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet Sport</title>
<meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#ECEEEA; --surface:#FFFFFF; --surface-2:#F3F4F1; --ink:#14171A; --ink-2:#4F555A; --muted:#7D8387;
  --line:#DCDFD8; --line-2:#C5C9C1; --accent:#F2B705; --accent-soft:#FCEFC2; --on-accent:#14171A;
  --btn:#14171A; --on-btn:#F3F4F1; --s1:#2a78d6; --s2:#eb6834; --s1-soft:rgba(42,120,214,.30);
  --good:#0ca30c; --good-text:#0B6B14; --warn:#fab219; --crit:#d03b3b; --crit-text:#B42F2F;
  --shadow:0 1px 2px rgba(20,23,26,.06), 0 8px 24px rgba(20,23,26,.06);
  --r:14px; --nav-h:62px; --m1:#86b6ef; --m2:#3987e5; --m3:#1c5cab; --m4:#0d366b;
  --f-d:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1012; --surface:#171A1D; --surface-2:#1F2327; --ink:#EDEFEB; --ink-2:#B3B8B9; --muted:#80868A;
    --line:#2A2F33; --line-2:#3A4045; --accent:#F2B705; --accent-soft:#3A3114; --on-accent:#14171A;
    --btn:#EDEFEB; --on-btn:#14171A; --s1:#3987e5; --s2:#d95926; --s1-soft:rgba(57,135,229,.32);
    --good-text:#3CC23C; --crit-text:#E66767; --shadow:none; color-scheme:dark; --m1:#184f95; --m2:#2a78d6; --m3:#6da7ec; --m4:#b7d3f6;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1012; --surface:#171A1D; --surface-2:#1F2327; --ink:#EDEFEB; --ink-2:#B3B8B9; --muted:#80868A;
  --line:#2A2F33; --line-2:#3A4045; --accent:#F2B705; --accent-soft:#3A3114; --on-accent:#14171A;
  --btn:#EDEFEB; --on-btn:#14171A; --s1:#3987e5; --s2:#d95926; --s1-soft:rgba(57,135,229,.32);
  --good-text:#3CC23C; --crit-text:#E66767; --shadow:none; color-scheme:dark; --m1:#184f95; --m2:#2a78d6; --m3:#6da7ec; --m4:#b7d3f6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.inp[type="date"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left}
html,body{background:var(--ground)}
body{color:var(--ink);font:15px/1.45 var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 72px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-inline:-16px;padding:10px 16px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.mark{font:700 24px/1 var(--f-d);letter-spacing:.08em;text-transform:uppercase}
.mark i{font-style:normal;color:var(--accent);-webkit-text-stroke:.5px var(--on-accent)}
@media (max-width:440px){.brand .sub{display:none}}
.brand .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.busy::before{background:var(--warn)} .sync.err::before{background:var(--crit)}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg,.tabs svg,.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font:700 30px/1.05 var(--f-d);letter-spacing:.01em}
.eyebrow{font:600 12px/1.2 var(--f-b);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-t{font:600 15px/1.2 var(--f-d);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card>.sec-t{margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap} .row.end{justify-content:flex-end} .row.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.num-t{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:11px;background:var(--btn);color:var(--on-btn);font-weight:600;white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:9px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line-2)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--crit);color:#fff}
.btn.ghost.danger{background:transparent;color:var(--crit-text);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.block{width:100%}
.lnk{color:var(--ink);font-weight:600;font-size:14px;padding:8px 4px;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{color:inherit;opacity:.7;font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{min-height:32px;padding:0 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:500}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);color:var(--ink);font-size:16px}
textarea.inp{min-height:80px;resize:vertical;line-height:1.4}
.inp::placeholder{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:6px}
.daybar .d{font:700 23px/1.05 var(--f-d);text-align:center;flex:1;min-width:0}
.daybar .d small{display:block;font:500 12px/1.3 var(--f-b);color:var(--muted);letter-spacing:.02em}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .v{font:700 28px/1 var(--f-d);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v.sm{font-size:19px;white-space:normal;line-height:1.15;overflow:visible}
.tile .v small{font:600 14px var(--f-d);color:var(--ink-2);margin-left:2px}
.tile .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.delta{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.delta.up{color:var(--good-text)} .delta.down{color:var(--crit-text)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good-text)}
.pill.warn{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--ink)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4}
.goal{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:2px}
.goal .gl{font-weight:600}
.goal .gv{font:700 18px/1 var(--f-d);text-align:right;font-variant-numeric:tabular-nums}
.goal .gv small{font:500 13px var(--f-b);color:var(--muted)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.bar>span{display:block;height:100%;background:var(--ink)}
.bar>span.good{background:var(--good)}
.bar>span.est{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);opacity:.8}
.goal .gs{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.li .r{font:700 18px/1 var(--f-d);white-space:nowrap;text-align:right}
.li .r small{display:block;font:500 12px var(--f-b);color:var(--muted);margin-top:3px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:1px 7px;border-radius:6px;vertical-align:middle}
.badge-pr{display:inline-flex;align-items:center;gap:3px;font:700 12px/1 var(--f-d);letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:4px 7px;border-radius:6px;vertical-align:middle}
/* Séance */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tpl{background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.tpl b{font:700 18px/1.1 var(--f-d)}
.tpl span{font-size:12.5px;color:var(--muted)}
.tpl.sug{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.tpl.sug span::before{content:"Prévu aujourd'hui · ";color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.ex.todo{border-style:dashed;box-shadow:none}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-h h3{font:700 21px/1.1 var(--f-d);letter-spacing:.01em;margin-right:6px;display:inline}
.ex-h .tags{display:inline-flex;gap:6px;vertical-align:2px;flex-wrap:wrap}
.ex .last{margin:0;font-size:13px;color:var(--muted)}
.ex .last b{color:var(--ink-2);font-weight:600}
.ex .exnote{margin:0;font-size:13px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:6px 9px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 12px minmax(0,1fr) 44px 26px;align-items:center;gap:5px;border-radius:10px;padding:3px 0}
.set.cardio{grid-template-columns:22px repeat(3,minmax(0,1fr)) 44px 26px}
.set .n{font:700 17px/1 var(--f-d);color:var(--muted);text-align:center}
.set.drop .n{color:var(--ink-2)}
.set .x{text-align:center;color:var(--muted);font-weight:600}
.f{position:relative;display:block}
.f small{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.num{width:100%;height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface-2);color:var(--ink);text-align:left;padding:0 28px 0 9px;font:600 20px/1 var(--f-d);font-variant-numeric:tabular-nums}
.num::placeholder{color:var(--muted);opacity:.75;font-weight:500}
.set.ok .num{background:var(--accent-soft);border-color:transparent}
.ok-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--muted)}
.ok-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.set.ok .ok-btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.del{width:26px;height:36px;display:grid;place-items:center;color:var(--muted);border-radius:8px}
.del svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.ex-actions{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.quick{display:flex;gap:6px;flex:1;min-width:210px}
.quick input{flex:1;min-width:0;height:36px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface-2);padding:0 10px;font-size:15px;color:var(--ink)}
.props{display:flex;flex-direction:column;gap:14px}
.prop-g h4{margin:0 0 4px;font:600 13px/1.2 var(--f-b);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prop{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.prop:first-of-type{border-top:0}
.prop .main{flex:1;min-width:0}
.prop .t{font-weight:600}
.prop .s{font-size:12.5px;color:var(--muted)}
.plus{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--ink);display:grid;place-items:center;flex:none}
.plus svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
/* Nutrition */
.meal{display:flex;flex-direction:column;gap:6px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.meal-h b{font:700 19px/1.1 var(--f-d)}
.meal-h .k{font:600 16px var(--f-d);color:var(--ink-2)}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .s{font-size:12px;color:var(--muted)}
.item .k{font:700 17px var(--f-d);white-space:nowrap}
.imputed{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;border:1px dashed var(--line-2)}
.macro{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;font-size:13.5px}
.macro .bar{grid-column:auto}
.macro b{font:700 16px var(--f-d);white-space:nowrap}
.big{font:700 40px/1 var(--f-d);letter-spacing:.01em}
.big small{font:600 17px var(--f-d);color:var(--muted)}
.bd{display:flex;flex-direction:column;gap:4px;font-size:13px}
.bd div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line-2);padding:3px 0}
/* Charts */
.chart{position:relative;height:220px;margin-top:6px}
.chart.sm{height:180px}
.chart-t{font-weight:600;font-size:14px}
.chart-s{font-size:12.5px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-inline:-2px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line-2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.w{white-space:normal}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{display:block;width:14px;height:14px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.heat i.l1{background:#86b6ef;border-color:transparent} .heat i.l2{background:#3987e5;border-color:transparent}
.heat i.l3{background:#1c5cab;border-color:transparent} .heat i.l4{background:#0d366b;border-color:transparent}
.heat i.fut{opacity:.35}
.spark{width:84px;height:28px;flex:none}
.spark polyline{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark circle{fill:var(--s1)}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.hbar .track{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.hbar b{font:700 16px var(--f-d);text-align:right}
/* Empty & misc */
.empty{text-align:center;padding:22px 12px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font:700 20px var(--f-d);margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.hero{display:flex;flex-direction:column;gap:10px}
.hero .plan{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plan-bar{flex:1;min-width:140px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.plan-bar span{display:block;height:100%;background:var(--accent)}
details.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.card[open]>summary::after{transform:rotate(-135deg)}
details.card[open]>summary{margin-bottom:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
pre.code{display:block;padding:10px;white-space:pre-wrap;overflow-x:auto;margin:6px 0 0}
/* Nav, sheet, toast, rest */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.rest{position:fixed;z-index:31;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;font-size:14px}
.rest b{font:700 22px/1 var(--f-d);font-variant-numeric:tabular-nums;min-width:44px}
.rest button{white-space:nowrap;min-height:34px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--surface) 16%,transparent);color:var(--surface);font-weight:600;font-size:13px}
.rest.done{background:var(--accent);color:var(--on-accent)}
.rest.done button{color:var(--on-accent);background:rgba(0,0,0,.08)}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,12,14,.45)}
.sheet{position:relative;width:100%;max-width:640px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet h2{font:700 24px/1.1 var(--f-d)}
.sheet p{margin:0}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 4px;border-top:1px solid var(--line);font-weight:600}
.opt:first-of-type{border-top:0}
.opt.danger{color:var(--crit-text)}
.checks{display:flex;flex-direction:column;gap:2px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.checks label{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14.5px}
.checks input{width:20px;height:20px;accent-color:var(--ink)}
.checks h5{margin:8px 0 2px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 64px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.4s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
/* v2 : ajout rapide, gamification */
.qrow{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qc{flex:none;min-height:36px;padding:0 12px 0 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:250px}
.qc .nm{overflow:hidden;text-overflow:ellipsis}
.qc small{color:var(--muted);font-weight:600;font-size:12px}
.qc svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.qc.fav{background:var(--accent-soft);border-color:transparent}
.qc.fav svg{fill:var(--accent);stroke:var(--ink);stroke-width:1.2}
.item-w{display:flex;align-items:stretch;gap:6px}
.item-w .item{flex:1;min-width:0}
.star-btn{width:42px;flex:none;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.star-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star-btn.on svg{fill:var(--accent);stroke:var(--ink);stroke-width:1.2}
.gstrip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.gstrip>.plate{grid-row:1/span 3;width:52px;height:52px}
.plate{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.plate::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.lvl b{font:700 24px/1 var(--f-d)} .lvl span{font-size:13.5px;color:var(--ink-2);font-weight:600}
.xpbar{grid-column:2/-1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.xpbar span{display:block;height:100%;background:var(--accent);border-radius:99px}
.streak{display:flex;align-items:center;gap:6px;font:700 24px/1 var(--f-d);color:var(--ink)}
.streak svg{width:24px;height:24px;fill:var(--s2);stroke:none}
.streak small{display:block;font:500 11px/1.2 var(--f-b);color:var(--muted)}
.today{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.today{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tq{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;text-align:left;min-width:0;box-shadow:var(--shadow)}
.tq>span:last-child{display:flex;flex-direction:column;min-width:0}
.ring{--p:0;width:42px;height:42px;border-radius:50%;flex:none;background:conic-gradient(var(--rc,var(--ink)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring::after{content:"";width:30px;height:30px;border-radius:50%;background:var(--surface)}
.ring.full{--rc:var(--good)}
.tq .l{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tq .v{font:700 17px/1.15 var(--f-d);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.bdg{border:1px solid var(--line);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.bdg .plate{width:34px;height:34px}
.bdg b{font:700 15px/1.1 var(--f-d)} .bdg span{font-size:11.5px;color:var(--muted);line-height:1.25}
.bdg.off b{color:var(--muted)} .bdg.off .plate{box-shadow:inset 0 0 0 2px var(--line-2)}
.sugg{display:inline-flex;align-items:center;gap:6px;text-align:left;align-self:flex-start;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--accent-soft);color:var(--ink)}
.toast .toast-act{margin-left:12px;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
/* v3 : mode salle plein écran */
body.focus-on #rest{display:none!important}
.focus{position:fixed;inset:0;z-index:45;background:var(--ground);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.fx-in{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.fx-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fx-top .icon-btn{width:44px;height:44px;background:var(--surface);border:1px solid var(--line)}
.fx-meta{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.fx-meta b{font:700 14px var(--f-d);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fx-meta span{font:700 24px var(--f-d);font-variant-numeric:tabular-nums}
.fx-ex h2{font:700 clamp(30px,9vw,44px)/1.02 var(--f-d);margin:6px 0 4px;text-wrap:balance}
.fx-ex .tags{display:flex;gap:6px;flex-wrap:wrap}
.fx-last{margin:0;color:var(--muted);font-size:14px} .fx-last b{color:var(--ink-2)}
.fx-ex .sugg{margin-top:8px}
.pips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pip{width:40px;height:40px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;background:var(--surface);color:var(--muted);font:700 15px var(--f-d)}
.pip.drop{width:30px;height:30px;font-size:12px}
.pip.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pip.cur{box-shadow:0 0 0 3px var(--ground),0 0 0 5px var(--ink);color:var(--ink)}
.pip svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.pip.add{border-style:dashed;color:var(--ink-2)}
.fx-set-l{font:700 19px var(--f-d);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stepper .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.st-row{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:10px}
.st-btn{height:64px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);font:600 38px/1 var(--f-d);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.st-btn:active{background:var(--accent-soft)}
.st-val{position:relative;display:block}
.fx-num{width:100%;height:64px;border:0;border-radius:10px;background:transparent;text-align:center;font:700 54px/1 var(--f-d);color:var(--ink);font-variant-numeric:tabular-nums;padding:0 26px 0 0}
.fx-num:focus{background:var(--surface-2)}
.fx-num::placeholder{color:var(--muted);opacity:.55}
.st-val small{position:absolute;right:0;bottom:10px;font-size:14px;color:var(--muted);font-weight:600;pointer-events:none}
.fx-go{min-height:64px;font-size:20px;border-radius:16px;width:100%}
.fx-rest{display:flex;flex-direction:column;align-items:center;gap:16px;padding:4px 0}
.fx-ring{--p:100;width:min(64vw,250px);aspect-ratio:1/1;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.fx-ring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--ground)}
.fx-ring>*{position:relative}
.fx-ring b{font:700 68px/1 var(--f-d);font-variant-numeric:tabular-nums}
.fx-ring span{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fx-rest .row .btn{min-width:120px}
.fx-next{margin:0;font-size:15px;color:var(--ink-2);text-align:center}
.fx-done{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 0}
.fx-done h2{font:700 34px/1.05 var(--f-d)}
.fx-done .plate{width:84px;height:84px}
.fx-bot{margin-top:auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding-top:6px}
.fx-bot .btn{padding:0 10px}
.fx-launch{min-height:52px;font-size:17px}
.fx-launch svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fx-list .li b{font:700 16px var(--f-d)}
/* v4 : accueil Aujourd'hui, activité, rituel */
.gbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 12px}
.gbar .plate{width:38px;height:38px}
.gb-mid{display:flex;flex-direction:column;gap:6px;min-width:0}
.gb-mid{gap:5px}
.gb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.gb-l b{font-size:20px}
.gb-x{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gb-mid .xpbar{height:8px}
.gb-st{display:flex;align-items:center;gap:4px;font:700 20px/1 var(--f-d)}
.gb-st svg{width:20px;height:20px;fill:var(--s2);stroke:none;flex:none}
.gb-st.cl svg{fill:none;stroke:var(--good-text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.gb-st>span{display:flex;flex-direction:column;align-items:flex-start}
.gb-st small{display:block;font:500 10.5px/1.1 var(--f-b);color:var(--muted)}
@media (max-width:360px){.gb-st.cl{display:none}}
.today-card{display:flex;flex-direction:column;gap:12px}
.quests{display:flex;flex-direction:column}
.qst{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.qst:first-child{border-top:0;padding-top:2px}
.qst .main{flex:1;min-width:0;display:flex;flex-direction:column}
.qst .t{font-weight:600;font-size:15.5px}
.qst .t b{font:700 17px var(--f-d)}
.qst .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qst .ring{width:38px;height:38px}
.qst .ring::after{width:28px;height:28px}
.qst.done .t{color:var(--ink-2)}
.chk{width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;flex:none}
.chk svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.xp-h{font:700 13px var(--f-d);color:var(--ink);background:var(--accent-soft);padding:3px 7px;border-radius:6px;white-space:nowrap}
.next-btn{min-height:62px;flex-direction:column;gap:2px;border-radius:14px;white-space:normal;text-align:center;padding:8px 14px}
.next-btn span{font:700 20px/1.1 var(--f-d);letter-spacing:.01em}
.next-btn small{font-size:12.5px;font-weight:500;opacity:.85}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa label{cursor:pointer}
.qa button,.qa label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.qa .ico{width:22px;height:22px}
.recap-card{background:var(--accent-soft);border-color:transparent}
details.wk>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
details.wk>summary::-webkit-details-marker{display:none}
details.wk>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);margin-right:4px;flex:none;transition:transform .15s}
details.wk[open]>summary::after{transform:rotate(-135deg)}
details.wk>summary>span{display:flex;flex-direction:column;gap:3px;min-width:0}
.wk-sum{font-size:13px;color:var(--muted)}
.wk-body{margin-top:16px;gap:16px}
.xrow .xl{flex:none;align-self:center;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.rits{display:flex;flex-direction:column}
.rit{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.rit:first-child{border-top:0}
.rit-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rit-h b{font:700 18px var(--f-d)}
.rit-h span{font-size:12.5px;color:var(--muted);text-align:right}
.rit-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg.rit-seg{display:flex;width:100%}
.rit-seg button{flex:1;min-height:40px;padding:0 6px}
button.pill{border:0;cursor:pointer}
.xp-pop{position:fixed;z-index:72;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font:700 22px/1 var(--f-d);padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none;opacity:0}
.xp-pop.go{opacity:1;animation:xpu 1.5s ease-out forwards}
@keyframes xpu{0%{opacity:0;transform:translate(-50%,12px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}70%{opacity:1;transform:translate(-50%,-6px)}100%{opacity:0;transform:translate(-50%,-26px)}}
/* v4.5 : muscles */
.bodymap{width:100%;max-width:440px;height:auto;display:block;margin:4px auto 0;touch-action:manipulation}
.bodymap .bm-base{fill:var(--surface-2);stroke:var(--line-2);stroke-width:.8}
.bodymap .bm-r{stroke:var(--surface);stroke-width:1;cursor:pointer}
.bodymap .bm-0{fill:var(--surface);stroke:var(--line-2);stroke-dasharray:2 1.5}
.bodymap .bm-1{fill:var(--m1)} .bodymap .bm-2{fill:var(--m2)} .bodymap .bm-3{fill:var(--m3)} .bodymap .bm-4{fill:var(--m4)}
.bodymap .bm-sel{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:none}
.bodymap .bm-lab{font:600 11px var(--f-b);fill:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.bm-leg{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;font-size:12px;color:var(--ink-2)}
.bm-leg span{display:inline-flex;align-items:center;gap:5px}
.bm-leg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.bm-leg i.bm-0{background:var(--surface);border:1px dashed var(--line-2)} .bm-leg i.bm-1{background:var(--m1)} .bm-leg i.bm-2{background:var(--m2)} .bm-leg i.bm-3{background:var(--m3)} .bm-leg i.bm-4{background:var(--m4)}
.bm-leg em{font-style:normal;color:var(--muted);width:100%;text-align:center;font-size:11.5px}
.mbar{position:relative;grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:6px 0 4px}
.mbar .zone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.mbar span{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--s1)}
.mbar span.hi{background:var(--warn)} .mbar span.lo{background:var(--muted)}
.mus-row .main{display:flex;flex-direction:column}
.mus-det{border-top:1px solid var(--line);padding-top:12px}
.ins .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--line-2)}
.ins .dot.l3{background:var(--crit)} .ins .dot.l2{background:var(--warn)} .ins .dot.l1{background:var(--s1)}
.opt:disabled{opacity:.5;cursor:default}
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
@media (max-width:400px){.seg button{padding:0 9px;font-size:13.5px}}
/* v4.6 : statut des objectifs nutrition */
.bar>span.warn{background:var(--warn)} .bar>span.crit{background:var(--crit)}
.pill.crit{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit-text)}
.macro{grid-template-columns:78px minmax(0,1fr) auto 62px}
.macro .st{justify-self:end}
.nut-st{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--muted)}
/* v4.8 : coach et rappels */
.coach{border-left:4px solid var(--accent)}
.coach .ctitle{font:700 19px/1.2 var(--f-d)}
.coach ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.coach p{margin:8px 0 0;font-size:14px;color:var(--ink-2)}
/* v4.9 : dernière séance et comparaison */
.ls .li{padding:8px 0}
.ls .li:first-child{border-top:0}
.ls .li .s{color:var(--ink-2);font-weight:600;font-size:13.5px}
.ls-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ls-head h2{margin:3px 0 0;font:700 19px/1.2 var(--f-d)}
.ls-nav{display:flex;gap:4px;flex:none}
.ls-meta{margin:0;font-size:13px;color:var(--muted)}
.ls-det .ls{margin-top:10px}
.prop-sub{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.prop-more>summary{list-style:none;cursor:pointer;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.prop-more>summary::-webkit-details-marker{display:none}

/* Défis calibrés, semaines off, joker */

async function bulkImport(data) {

  for (const c of COLS) for (const [id, doc] of Object.entries(data[c] || {})) if (doc && typeof doc === 'object') list.push([c, id, doc]);

    else n++;

}

  const el = $('#rest'); el.hidden = false; el.classList.remove('done'); $('#rest-label').textContent = 'Repos';
  clearInterval(REST.t); clearTimeout(REST.hide); tickRest(); REST.t = setInterval(tickRest, 250);
}
function tickRest() {
  const left = Math.max(0, Math.ceil((REST.end - Date.now()) / 1000)), txt = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $('#rest-time').textContent = txt;
  const fr = $('#fx-rest-time'); if (fr) { fr.textContent = txt; const ring = $('#fx-ring'); if (ring) ring.style.setProperty('--p', Math.max(0, Math.min(100, (REST.end - Date.now()) / (REST.dur * 1000) * 100))); }
  if (left <= 0) {
    clearInterval(REST.t); REST.on = false;
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch { }
    if (FOCUS.open && FOCUS.phase === 'rest') { $('#rest').hidden = true; fxGoNext(); return; }
    $('#rest').classList.add('done'); $('#rest-label').textContent = 'À toi';
    clearTimeout(REST.hide); REST.hide = setTimeout(stopRest, 6000);
  }
}
function stopRest() { clearInterval(REST.t); clearTimeout(REST.hide); REST.on = false; $('#rest').hidden = true; }

const mkDoc = r => ({ id: r.doc_id, data: () => r.data });
async function fetchCol(col) {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('docs').select('doc_id,data,updated_at').eq('col', col).range(from, from + 999);
    if (error) throw error; out.push(...data); if (data.length < 1000) break;
  }

}
const RT = {
  subs: {}, chan: null, last: null, polling: false,
  async listen(col, cb, errCb) {
    this.subs[col] = { cb, errCb };
    let rows;
    try { rows = await fetchCol(col); } catch (e) { errCb && errCb(sbErr(e)); return; }
    for (const r of rows) if (r.updated_at && (!this.last || r.updated_at > this.last)) this.last = r.updated_at;
    if (!this.last) this.last = new Date(Date.now() - 60000).toISOString();
    const docs = rows.map(mkDoc);
    cb({ docs, docChanges: () => docs.map(doc => ({ type: 'added', doc })) });
    this.ensureChannel();
    if (col === 'exercises' && !rows.length) seedCatalogue();
  },
  dispatch(row, type) {
    const s = this.subs[row.col]; if (row.updated_at && row.updated_at > this.last) this.last = row.updated_at;
    if (!s) return; const doc = mkDoc(row);
    s.cb({ docs: [], docChanges: () => [{ type, doc }] });
  },
  ensureChannel() {
    if (this.chan || !AUTH.user) return;
    this.chan = sb.channel('docs-' + AUTH.user.id)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: 'user_id=eq.' + AUTH.user.id }, p => {
        const row = p.eventType === 'DELETE' ? p.old : p.new; if (!row || !row.col) return;
        this.dispatch(row, p.eventType === 'DELETE' ? 'removed' : p.eventType === 'INSERT' ? 'added' : 'modified');
      })
      .subscribe(status => { if (status === 'SUBSCRIBED') this.poll(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.poll(); });
    window.addEventListener('online', () => this.poll());
    setInterval(() => { if (document.visibilityState === 'visible') this.poll(); }, 90000);
  },
  async poll() {
    if (!this.last || this.polling) return; this.polling = true;
    try {
      const { data, error } = await sb.from('docs').select('col,doc_id,data,updated_at').gt('updated_at', this.last).order('updated_at').limit(500);
      if (error) throw error;
      for (const r of data) this.dispatch(r, 'modified');
      if (Store.err === 'unavailable') { Store.err = null; syncUI(); }
    } catch (e) { } finally { this.polling = false; }
  }
};

/* Estimations IA via la fonction serveur « ai » (clé Anthropic côté serveur) */
function fileToB64(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', .85).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(mkErr('images_unavailable', 'image illisible')); };
    img.src = url;
  });
}
const AI = {
  async limits() { return { images: SAMPLE_IMG }; },
  async json(prompt, opts = {}) {
    const body = { prompt, tier: opts.modelTier || 'quick' };
    if (opts.images) body.image = await fileToB64(opts.images);
    let r;
    try { r = await fetch(SB_URL + '/functions/v1/ai', { method: 'POST', headers: fnHeaders(), body: JSON.stringify(body), signal: opts.signal }); }
    catch (e) { throw e && e.name === 'AbortError' ? mkErr('cancelled') : mkErr('unavailable'); }
    if (r.status === 503) throw mkErr('not_granted', 'clé IA absente');
    if (r.status === 429) throw mkErr('rate_limited');
    if (r.status === 401 || r.status === 403) throw mkErr('not_granted');
    if (!r.ok) throw mkErr('error', 'HTTP ' + r.status);
    const j = await r.json(); return j.json;
  }
};

    <p class="small" style="margin:0">L’iPhone envoie ici chaque jour les données de l’app Santé : pas, calories, sommeil, poids, masse grasse. Deux façons, même jeton : un <b>Raccourci automatique</b> (gratuit, à créer une fois) ou l’app <b>Health Auto Export</b> (achat unique, zéro réglage).</p>
    <div id="hae-box" class="stack">${HAE.loaded ? haeInner() : '<span class="tiny muted">Chargement…</span>'}</div></section>`;
}
async function haeRotate() {
  const { data, error } = await sb.rpc('import_token_rotate');
  if (error) { toast('Impossible de créer le jeton : ' + error.message); return; }
  HAE.token = data; await haeLoad(); toast('Jeton créé : copie-le maintenant, il ne sera plus affiché.');
}
function haeGuideHtml() {
  return `<h2>Avec Health Auto Export</h2>
  <p class="small">Solution sans réglage compliqué. L’export automatique demande l’offre Premium de l’app : achat unique 24,99 $ (ou 6,99 $ par an).</p>
  <ol class="steps">
    <li><b>Installe « Health Auto Export - JSON+CSV »</b> (App Store, éditeur HealthyApps) et autorise l’accès aux données Santé demandées.</li>
    <li>Dans le Carnet, Réglages > Import automatique iPhone : <b>« Activer l’import automatique »</b>, puis copie le jeton et l’adresse.</li>
    <li>Dans Health Auto Export : <b>Automations</b> > <b>+</b> > <b>REST API</b>. Colle l’adresse dans URL. Format JSON, méthode POST. Dans <b>Headers</b>, ajoute une ligne : clé <code>X-API-Key</code>, valeur = ton jeton.</li>
    <li><b>Données</b> : Health Metrics, agrégation <b>par jour</b> (Aggregate interval : Days), période <b>3 derniers jours</b>. Coche : Step Count, Active Energy, Basal Energy Burned, Apple Exercise Time, Walking + Running Distance, Body Mass, Body Fat Percentage, Lean Body Mass, Resting Heart Rate, Sleep Analysis.</li>
    <li><b>Fréquence</b> : toutes les 1 day, par exemple à 8 h. Lance un export manuel pour tester : « Dernier import » s’affiche ici quelques secondes après.</li>
  </ol>
  <p class="small muted">iOS n’autorise l’export que si l’iPhone est déverrouillé au moment prévu ; si un jour manque, ouvre simplement l’app une fois.</p>
  <div class="row end"><button class="btn" data-a="sheet-close">Fermer</button></div>`;
}
function scGuideHtml() {
  const tok = HAE.token ? esc(HAE.token) : 'ton jeton';
  return `<h2>Raccourci automatique (gratuit)</h2>
  <p class="small">Un raccourci de 15 actions à créer une fois dans l’app <b>Raccourcis</b> de l’iPhone, puis une automatisation qui le lance chaque matin. Compte 10 minutes. Avant de commencer : « Activer l’import automatique » ci-dessus, puis copie le jeton et l’adresse.</p>
  <p class="small"><b>A. Le raccourci</b> (Raccourcis > + > nomme-le « Carnet Santé auto »)</p>
  <ol class="steps">
    <li><b>Rechercher des échantillons de santé</b> : Type <b>Analyse du sommeil</b>. Ajoute un filtre : Date de début <b>est dans les 2 derniers jours</b>. Trier par Date de début, ordre croissant.</li>
    <li><b>Ajouter à une variable</b> : nomme la variable <b>Echantillons</b>.</li>
    <li>Rechercher des échantillons de santé : Type <b>Pas</b>, <b>Grouper par : jour</b>, filtre Date de début dans les 3 derniers jours.</li>
    <li>Ajouter à la variable <b>Echantillons</b>.</li>
    <li>Rechercher des échantillons de santé : Type <b>Énergie active</b>, Grouper par jour, 3 derniers jours.</li>
    <li>Ajouter à la variable <b>Echantillons</b>.</li>
    <li>Rechercher des échantillons de santé : Type <b>Poids</b>, 3 derniers jours (sans regroupement).</li>
    <li>Ajouter à la variable <b>Echantillons</b>.</li>
    <li>Rechercher des échantillons de santé : Type <b>Masse grasse</b>, 3 derniers jours.</li>
    <li>Ajouter à la variable <b>Echantillons</b>.</li>
    <li><b>Répéter avec chaque élément</b> de <b>Echantillons</b>.</li>
    <li>Dans la boucle, action <b>Texte</b> avec, séparées par une barre verticale <code>|</code>, six propriétés de <b>Élément répété</b> : <code>Date de début|Date de fin|Valeur|Unité|Type|Source</code>. Pour insérer une propriété : tape « Élément répété » dans le texte, touche le jeton puis choisis la propriété. Pour <b>Date de début</b> et <b>Date de fin</b> : touche le jeton > Format de date <b>Personnalisé</b> > chaîne <code>yyyy-MM-dd HH:mm</code>. Si « Type » ou « Source » n’est pas proposé, laisse la case vide (les barres restent).</li>
    <li>Toujours dans la boucle : <b>Ajouter à une variable</b> nommée <b>Lignes</b>.</li>
    <li>Après la fin de la répétition : <b>Combiner le texte</b> : <b>Lignes</b>, séparateur <b>Nouvelle ligne</b>.</li>
    <li><b>Obtenir le contenu de l’URL</b> : URL = l’adresse copiée. Ouvre « Afficher plus » : Méthode <b>POST</b>, En-têtes : ajoute <code>X-API-Key</code> = <code>${tok}</code>, Corps de la requête : <b>Fichier</b> = le <b>Texte combiné</b>.</li>
  </ol>
  <p class="small">Lance le raccourci une fois à la main : « Dernier import » s’affiche ici quelques secondes après. À la première exécution, l’iPhone demande l’accès aux données Santé et l’autorisation de contacter l’adresse : accepte.</p>
  <p class="small"><b>B. L’automatisation</b> : Raccourcis > onglet <b>Automatisation</b> > + > <b>Heure de la journée</b> > 8:00, Quotidien > <b>Exécuter immédiatement</b> (sans demander) > choisis « Carnet Santé auto ».</p>
  <p class="small muted">Poids et masse grasse Withings sont lus dans l’app Santé, donc suivis. Les nuits mesurées par plusieurs appareils sont dédoublonnées ici. Si un matin manque, lance le raccourci à la main.</p>
  <div class="row end"><button class="btn" data-a="sheet-close">Fermer</button></div>`;
}
Object.assign(A, {
  'hae-token': () => { if (HAE.row) confirmSheet({ title: 'Remplacer le jeton ?', text: 'L’ancien jeton cessera de fonctionner : il faudra coller le nouveau dans le Raccourci ou dans Health Auto Export.', ok: 'Remplacer', onOk: haeRotate }); else haeRotate(); },
  'hae-guide': () => openSheet(haeGuideHtml()),
  'sc-guide': () => openSheet(scGuideHtml())
});

UI._t = today();
boot();
</script>
</body>
</html>
